<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Tugas</title>

    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <h1>Daftar Tugas - P6_074</h1>

    <input type="text"
           id="inputTugas"
           placeholder="Masukkan tugas">

    <button onclick="tambahTugas()">Tambah Tugas</button>
    <button onclick="tampilkanTugas()">Tampilkan Daftar Tugas</button>

    <ul id="listTugas" style="display: none;"></ul>


    <script>

        // Membuat array untuk menyimpan tugas
        const daftarTugas = [];


        // Fungsi untuk menambahkan tugas
        function tambahTugas() {

            const input = document.getElementById('inputTugas');
            const tugas = input.value.trim();

            if (tugas) {

                // Menambahkan tugas ke array
                daftarTugas.push({
                    text: tugas,
                    completed: false
                });

                console.log(`Tugas "${tugas}" berhasil ditambahkan.`);

                // Mengosongkan input
                input.value = '';

                alert(`Tugas "${tugas}" berhasil ditambahkan.`);

            } else {

                alert("Tugas tidak boleh kosong.");

            }
        }


        // Fungsi untuk menampilkan daftar tugas
        function tampilkanTugas() {

            const list = document.getElementById('listTugas');

            // Membersihkan daftar sebelum ditampilkan
            list.innerHTML = '';

            if (daftarTugas.length === 0) {

                list.innerHTML = '<li>Tidak ada tugas.</li>';

            } else {

                daftarTugas.forEach((tugas, index) => {

                    // Membuat elemen li
                    const li = document.createElement('li');

                    // Membuat checkbox
                    const checkbox = document.createElement('input');

                    checkbox.type = 'checkbox';
                    checkbox.checked = tugas.completed;

                    // Ketika checkbox dicentang
                    checkbox.onchange = () => tandaiSelesai(index);


                    // Membuat teks tugas
                    const span = document.createElement('span');

                    span.textContent = tugas.text;


                    // Jika tugas sudah selesai
                    if (tugas.completed) {

                        span.classList.add('completed');

                    }


                    // Membuat tombol hapus
                    const btnHapus = document.createElement('button');

                    btnHapus.textContent = 'Hapus';

                    btnHapus.onclick = () => hapusTugas(index);


                    // Memasukkan elemen ke dalam li
                    li.appendChild(checkbox);
                    li.appendChild(span);
                    li.appendChild(btnHapus);


                    // Memasukkan li ke dalam ul
                    list.appendChild(li);

                });
            }

            // Menampilkan daftar tugas
            list.style.display = 'block';
        }


        // Fungsi untuk menghapus tugas
        function hapusTugas(index) {

            if (index >= 0 && index < daftarTugas.length) {

                const tugasTerhapus = daftarTugas.splice(index, 1);

                console.log(
                    `Tugas "${tugasTerhapus[0].text}" berhasil dihapus.`
                );

                alert(
                    `Tugas "${tugasTerhapus[0].text}" berhasil dihapus.`
                );

                // Menampilkan ulang daftar
                tampilkanTugas();

            } else {

                alert("Indeks tugas tidak valid.");

            }
        }


        // Fungsi untuk menandai tugas selesai
        function tandaiSelesai(index) {

            daftarTugas[index].completed =
                !daftarTugas[index].completed;

            // Menampilkan ulang daftar
            tampilkanTugas();
        }

    </script>

</body>

</html>
